<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AgriRent AI database entity relationship diagram</title><desc id="desc">Users, equipment, bookings, equipment images, and reviews with their foreign-key relationships.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:19px;font-weight:bold}.f{font-size:15px}.l{font-size:14px;fill:#405064}.box{stroke-width:2}.line{stroke:#5c6b7c;stroke-width:2;fill:none}.card{font-size:13px;font-weight:bold;fill:#fff}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5c6b7c"/></marker></defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="50" y="38" class="t" font-size="25">AgriRent AI — Database ER Diagram</text>
  <path class="line" marker-end="url(#arrow)" d="M270 215H405"/><text class="l" x="300" y="202">owns 1 : many</text>
  <path class="line" marker-end="url(#arrow)" d="M270 242H770"/><text class="l" x="500" y="232">rents 1 : many</text>
  <path class="line" marker-end="url(#arrow)" d="M645 255H770"/><text class="l" x="655" y="242">has 1 : many</text>
  <path class="line" marker-end="url(#arrow)" d="M525 365V455"/><text class="l" x="535" y="420">has 1 : many</text>
  <path class="line" marker-end="url(#arrow)" d="M180 355V585H770"/><text class="l" x="415" y="578">writes 1 : many</text>
  <path class="line" marker-end="url(#arrow)" d="M645 330V585H770"/><text class="l" x="655" y="480">receives 1 : many</text>
  <g transform="translate(50 80)"><rect class="box" width="220" height="275" rx="8" fill="#f4fbf1" stroke="#82b366"/><rect width="220" height="37" rx="8" fill="#82b366"/><text x="12" y="25" class="card">USERS</text><text x="14" y="64" class="f">PK  id</text><text x="14" y="87" class="f">name</text><text x="14" y="110" class="f">email</text><text x="14" y="133" class="f">hashed_password</text><text x="14" y="156" class="f">phone</text><text x="14" y="179" class="f">role</text><text x="14" y="202" class="f">created_at</text></g>
  <g transform="translate(405 80)"><rect class="box" width="240" height="285" rx="8" fill="#f4f8ff" stroke="#6c8ebf"/><rect width="240" height="37" rx="8" fill="#6c8ebf"/><text x="12" y="25" class="card">EQUIPMENT</text><text x="14" y="64" class="f">PK  id</text><text x="14" y="87" class="f">FK  owner_id → users.id</text><text x="14" y="110" class="f">name, category, description</text><text x="14" y="133" class="f">price_per_day, location</text><text x="14" y="156" class="f">availability, image_url</text><text x="14" y="179" class="f">created_at</text></g>
  <g transform="translate(770 80)"><rect class="box" width="285" height="260" rx="8" fill="#fffbed" stroke="#d6b656"/><rect width="285" height="37" rx="8" fill="#d6b656"/><text x="12" y="25" class="card">BOOKINGS</text><text x="14" y="64" class="f">PK  id</text><text x="14" y="87" class="f">FK  equipment_id → equipment.id</text><text x="14" y="110" class="f">FK  renter_id → users.id</text><text x="14" y="133" class="f">start_date, end_date</text><text x="14" y="156" class="f">total_price, status</text><text x="14" y="179" class="f">created_at</text></g>
  <g transform="translate(405 455)"><rect class="box" width="240" height="170" rx="8" fill="#fff5f4" stroke="#b85450"/><rect width="240" height="37" rx="8" fill="#b85450"/><text x="12" y="25" class="card">EQUIPMENT_IMAGES</text><text x="14" y="64" class="f">PK  id</text><text x="14" y="87" class="f">FK  equipment_id → equipment.id</text><text x="14" y="110" class="f">image_url</text><text x="14" y="133" class="f">created_at</text></g>
  <g transform="translate(770 455)"><rect class="box" width="285" height="190" rx="8" fill="#faf5fd" stroke="#9673a6"/><rect width="285" height="37" rx="8" fill="#9673a6"/><text x="12" y="25" class="card">REVIEWS</text><text x="14" y="64" class="f">PK  id</text><text x="14" y="87" class="f">FK  user_id → users.id</text><text x="14" y="110" class="f">FK  equipment_id → equipment.id</text><text x="14" y="133" class="f">rating (1–5), comment</text><text x="14" y="156" class="f">created_at</text></g>
</svg>
